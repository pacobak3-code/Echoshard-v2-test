
name: Build Echo Anarchy SMP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download bestanden
        uses: actions/checkout@v4

      - name: Installeer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installeer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pak de plugin uit
        run: |
          mkdir -p plugin
          unzip -o EchoSMP-GitHub-Upload.zip -d plugin

      - name: Bouw de plugin
        run: |
          cd plugin
          gradle build

      - name: Bewaar de JAR
        uses: actions/upload-artifact@v4
        with:
          name: EchoAnarchySMP-JAR
          path: plugin/build/libs/*.jar
          if-no-files-found: error
